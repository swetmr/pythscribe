<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fuzz fixture (PythScribe)</title>
    <link rel="stylesheet" href="./base.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react":              "https://esm.sh/react@18.3.1",
          "react-dom":          "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
          "react-dom/client":   "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
          "pyths-runtime":      "/runtime/src/index.js",
          "pyths-runtime/react":"/tests/e2e/harness/pyths-react-shim.js",
          "pyths-runtime/asyncio":"/runtime/asyncio.js"
        }
      }
    </script>

    <script type="module">
      window.__pythsRenderError = null;
      window.addEventListener("error", (e) => {
        window.__pythsRenderError = (e.error && e.error.stack) || String(e.message);
      });

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "list_5";

      try {
        const { createRoot } = await import("react-dom/client");
        const React = await import("react");
        const mod = await import(`/tests/e2e/fuzz/generated/${id}.js`);
        const App = mod.App;
        if (!App) throw new Error(`App export missing in ${id}.js`);
        const root = createRoot(document.getElementById("root"));
        root.render(React.createElement(App));
        await new Promise(r => setTimeout(r, 30));
        window.__pythsReady = true;
      } catch (err) {
        window.__pythsRenderError = (err && err.stack) || String(err);
        window.__pythsReady = true;
      }
    </script>
  </body>
</html>
