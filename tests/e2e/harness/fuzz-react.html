<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fuzz fixture (React)</title>
    <link rel="stylesheet" href="./base.css" />
  </head>
  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react":                "https://esm.sh/react@18.3.1",
          "react/jsx-runtime":    "https://esm.sh/react@18.3.1/jsx-runtime",
          "react/jsx-dev-runtime":"https://esm.sh/react@18.3.1/jsx-dev-runtime",
          "react-dom":            "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
          "react-dom/client":     "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
        }
      }
    </script>

    <script type="module">
      window.__pythsRenderError = null;
      window.addEventListener("error", (e) => {
        window.__pythsRenderError = (e.error && e.error.stack) || String(e.message);
      });

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || "list_5";

      try {
        const esbuildNs = await import("https://esm.sh/esbuild-wasm@0.21.5/esm/browser.js");
        const esbuild = esbuildNs.default || esbuildNs;
        await esbuild.initialize({ wasmURL: "https://esm.sh/esbuild-wasm@0.21.5/esbuild.wasm" });
        const tsxRes = await fetch(`/tests/e2e/fuzz/generated/${id}.tsx`);
        if (!tsxRes.ok) throw new Error(`fetch ${id}.tsx → ${tsxRes.status}`);
        const tsxSource = await tsxRes.text();
        const { code } = await esbuild.transform(tsxSource, {
            loader: "tsx", format: "esm", target: "es2020",
            jsx: "automatic", jsxImportSource: "react",
        });
        const blob = new Blob([code], { type: "application/javascript" });
        const url = URL.createObjectURL(blob);
        const mod = await import(/* @vite-ignore */ url);
        const App = mod.App || mod.default;
        if (!App) throw new Error(`App export missing in ${id}.tsx`);
        const { createRoot } = await import("react-dom/client");
        const React = await import("react");
        const root = createRoot(document.getElementById("root"));
        root.render(React.createElement(App));
        await new Promise(r => setTimeout(r, 30));
        window.__pythsReady = true;
      } catch (err) {
        window.__pythsRenderError = (err && err.stack) || String(err);
        window.__pythsReady = true;
      }
    </script>
  </body>
</html>
