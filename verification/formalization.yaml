# formalization.yaml — ten-proofs-style trust manifest for the PythScribe verified core.
#
# Adapted from github.com/openai/ten-proofs/formalization.yaml. Maps each
# Paper-C headline claim -> its FINAL Lean statement -> file/line -> the ACTUAL
# `#print axioms` footprint -> the `*_stub_fails`/discriminating-witness refuter
# that proves the theorem has teeth.
#
# GENERATED by verification/comparator/axiom_footprint.py (do not hand-edit the
# per-claim axioms/line fields — regenerate with `python comparator/axiom_footprint.py emit`).
# The claim SELECTION + informal names + witnesses live in comparator/headline_claims.py.
#
# Toolchain: leanprover/lean4:v4.31.0   |   Core: dependency-free Lean 4 (NO Mathlib).

project: PythScribe verified core (verification/PythExpandVerify.lean)
