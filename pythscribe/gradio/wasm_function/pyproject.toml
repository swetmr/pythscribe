[build-system]
requires = [
  "hatchling",
  "hatch-requirements-txt",
  "hatch-fancy-pypi-readme>=22.5.0",
]
build-backend = "hatchling.build"

[project]
name = "gradio_wasmfunction"
version = "0.0.1"
description = "pythscribe WasmFunction: run a @wasm kernel's compiled JS/WASM bundle in the browser inside Gradio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "pythscribe" }]
keywords = [
  "gradio-custom-component",
  "gradio-template-Fallback"
]
# Add dependencies here
dependencies = ["gradio>=6.0,<7.0"]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.8',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Topic :: Scientific/Engineering',
  'Topic :: Scientific/Engineering :: Artificial Intelligence',
  'Topic :: Scientific/Engineering :: Visualization',
]

# The repository and space URLs are optional, but recommended.
# Adding a repository URL will create a badge in the auto-generated README that links to the repository.
# Adding a space URL will create a badge in the auto-generated README that links to the space.
# This will make it easy for people to find your deployed demo or source code when they
# encounter your project in the wild.

# [project.urls]
# repository = "your github repository"
# space = "your space url"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.hatch.build]
artifacts = ["/backend/gradio_wasmfunction/templates", "*.pyi", "/\\backend\\gradio_wasmfunction\\templates"]

[tool.hatch.build.targets.wheel]
packages = ["/backend/gradio_wasmfunction"]
