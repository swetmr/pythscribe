name: Release

# PRE-TAG GATE (E7, 2026-08-27): this workflow only BUILDS and PUBLISHES —
# it runs no tests. Every conformance gate lives in ci.yml and runs on the
# main-branch push of the commit being tagged: the CPython differential
# corpus + corpus.d ratchet (MANIFEST.json), the Transcrypt-autotester
# two-sided ratchet (tests/conformance/autotester/baseline.json), the
# C1C3C4 message-layer shipped binding (verification/message-table.json),
# and the Lean drift gates. The internal pre-tag checklist requires that the
# ci.yml run be GREEN at the exact tagged commit before `git tag` — do not tag
# over a red or skipped CI run.

on:
  push:
    tags:
      - 'v*'
  # Manual re-run (e.g. to publish a package that was missing from a prior release).
  # Version comes from the wrapper package.json on a branch ref; publish.mjs is
  # idempotent, so it only publishes what is not already on the registry.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pyths
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pyths
            cross_linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: pyths
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pyths
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pyths.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pyths-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../pyths-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pyths-${{ matrix.target }}
          path: pyths-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # GitHub Release only on a tag push, not workflow_dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance (--provenance)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Stage each triple's binary into target/<triple>/release/
        run: |
          set -eux
          for d in artifacts/pyths-*; do
            target="$(basename "$d" | sed 's/^pyths-//')"
            mkdir -p "target/$target/release"
            f="$(ls "$d"/pyths-*.*)"
            case "$f" in
              *.tar.gz) tar xzf "$f" -C "target/$target/release" ;;
              *.zip)    unzip -o "$f" -d "target/$target/release" ;;
            esac
          done

      - name: Populate platform packages + SHASUMS
        run: node npm/build-platform-packages.mjs

      - name: Publish (platform packages first, wrapper last; refuses if any binary missing)
        run: node npm/publish.mjs --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: 'true'

      # Net that catches any install-resolution break (ETARGET, missing dep, bad
      # exec bit) from the REAL registry — the check that would have caught the
      # 0.2.2 ETARGET in CI instead of by hand. Fails the job loudly if broken.
      - name: Smoke-test the published install
        run: |
          set -eux
          VER="$(node -p "require('./npm/pythscribe/package.json').version")"
          # Wait for the WHOLE install closure to propagate — not just the wrapper.
          # On an idempotent backfill the wrapper is already visible while a freshly
          # published dep is not (the 0.2.2 false-red), so poll the deps too.
          for i in $(seq 1 12); do
            if npm view "pythscribe@$VER" version >/dev/null 2>&1 \
               && npm view "pyths-runtime@$VER" version >/dev/null 2>&1 \
               && npm view "vite-plugin-pyths@$VER" version >/dev/null 2>&1 \
               && npm view "next-plugin-pyths@$VER" version >/dev/null 2>&1; then break; fi
            echo "waiting for registry propagation of the full closure ($i)…"; sleep 10
          done
          D="$(mktemp -d)"; cd "$D"; npm init -y >/dev/null
          npm pkg set type=module                       # emitted .js is ESM — don't rely on Node's ambiguous-file detection
          npm install "pythscribe@$VER"                 # fails here on ETARGET / missing dep
          ./node_modules/.bin/pyths --version           # fails here if the binary exec bit is wrong
          printf 'print("smoke " + str(2**60))\n' > s.ps
          ./node_modules/.bin/pyths compile s.ps -o s.js
          node s.js | grep -F 'smoke 1152921504606846976'   # assert real output, not just a zero exit
