# cargo-about config (spec 13-09-26 M5): the third-party licence inventory of the `pyths` compiler
# binary bundled in the pip wheel (pythscribe/_bin/pyths[.exe]). Consumed ONLY by
# scripts/gen_third_party_notices.py, which renders third_party/ (committed, drift-gated against
# Cargo.lock by scripts/verify_wheel_license.py and tests/pythscribe/test_wheel_m5.py).
#
#   cargo about generate --format json -c about.toml -m crates/pyths_cli/Cargo.toml --offline --locked
#
# `accepted` is the licence ALLOWLIST: a dependency whose expression cannot be satisfied by one of
# these makes cargo-about (and therefore the generator) fail -- a copyleft or unknown licence
# entering the shipped binary is RED, not silently shipped. Order = preference when an expression
# offers a choice (`MIT OR Apache-2.0` -> MIT).
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "BSL-1.0",
  "CC0-1.0",
]
# Only what is LINKED into the binary: dev-deps never ship; build-deps run at build time only
# (proc-macro crates are normal deps and stay in -- over-inclusion is harmless, omission is not).
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The 5 release targets (pythscribe/build/_native.py::TRIPLE_TO_TAG -- the ONE authority; the
# generator asserts this list == its keys). The union over them is the notice set; the per-target
# crate lists come from `cargo metadata --filter-platform`.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# Never consult clearlydefined.io: the generator ALWAYS passes `--offline` (cargo-about 0.9.2: "only
# local files will be crawled for license information"), so the inventory is generated from the
# LOCAL registry sources and is reproducible (`--check` re-generates and diffs byte-for-byte).
