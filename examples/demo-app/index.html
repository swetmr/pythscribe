<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PythScribe Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        margin: 4rem auto;
        max-width: 32rem;
        line-height: 1.5;
      }
      h1 { font-size: 3rem; margin: 1rem 0; }
      button {
        padding: 0.5rem 1.25rem;
        font-size: 1rem;
        border: 1px solid #444;
        background: #fff;
        cursor: pointer;
        border-radius: 6px;
      }
      button:hover { background: #f0f0f0; }
      .note { color: #666; font-size: 0.9rem; margin-top: 2rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <p class="note">
      Compiled from <code>Counter.ps</code> via
      <code>pyths compile Counter.ps</code>.
    </p>

    <!-- React from CDN so the demo runs without a bundler -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- The compiled output. Run `pyths compile Counter.ps -o Counter.js` first. -->
    <script type="module">
      // Map "react" import in the compiled output to the global React.
      window.__counterMount = async () => {
        // The PythScribe compiled JS uses `import { createElement, Fragment } from 'react'`.
        // For the standalone demo we shim it with an import map.
        const { Counter } = await import("./Counter.js");
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(Counter));
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "pyths-runtime/react": "https://esm.sh/react@18"
        }
      }
    </script>
    <script type="module">
      window.__counterMount();
    </script>
  </body>
</html>
